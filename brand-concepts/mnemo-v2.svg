<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Mnemo</title>

  <!-- neck -->
  <rect x="482" y="520" width="60" height="35" fill="#a9cf68" stroke="#000000" stroke-width="18" />

  <!-- head group (tilted) -->
  <g transform="rotate(8 512 520)">
    <!-- antenna -->
    <rect x="497" y="205" width="30" height="90" fill="#000000" />
    <circle cx="512" cy="180" r="28" fill="#000000" />

    <!-- head -->
    <rect x="370" y="290" width="284" height="230" rx="10" fill="#f2d24b" stroke="#000000" stroke-width="18" />

    <!-- ears -->
    <rect x="335" y="345" width="34" height="60" fill="#f2d24b" stroke="#000000" stroke-width="18" />
    <rect x="655" y="345" width="34" height="60" fill="#f2d24b" stroke="#000000" stroke-width="18" />

    <!-- eyebrows -->
    <line x1="418" y1="345" x2="483" y2="328" stroke="#000000" stroke-width="16" stroke-linecap="square" />
    <line x1="548" y1="336" x2="608" y2="336" stroke="#000000" stroke-width="16" stroke-linecap="square" />

    <!-- eyes -->
    <circle cx="458" cy="392" r="34" fill="#000000" />
    <circle cx="580" cy="392" r="28" fill="#000000" />

    <!-- mouth -->
    <rect x="448" y="463" width="110" height="24" fill="#000000" />
  </g>

  <!-- torso -->
  <rect x="322" y="555" width="380" height="170" fill="#a9cf68" stroke="#000000" stroke-width="18" />

  <!-- arms -->
  <rect x="322" y="555" width="66" height="170" fill="#a9cf68" stroke="#000000" stroke-width="18" />
  <rect x="636" y="555" width="66" height="170" fill="#a9cf68" stroke="#000000" stroke-width="18" />

  <!-- bolt indicator -->
  <g transform="translate(446 574) scale(5.5)" fill="#ec2abf" stroke="black" stroke-width="2">
    <path
      d="M13 2l.018 .001l.016 .001l.083 .005l.011 .002h.011l.038 .009l.052 .008l.016 .006l.011 .001l.029 .011l.052 .014l.019 .009l.015 .004l.028 .014l.04 .017l.021 .012l.022 .01l.023 .015l.031 .017l.034 .024l.018 .011l.013 .012l.024 .017l.038 .034l.022 .017l.008 .01l.014 .012l.036 .041l.026 .027l.006 .009c.12 .147 .196 .322 .218 .513l.001 .012l.002 .041l.004 .064v6h5a1 1 0 0 1 .868 1.497l-.06 .091l-8 11c-.568 .783 -1.808 .38 -1.808 -.588v-6h-5a1 1 0 0 1 -.868 -1.497l.06 -.091l8 -11l.01 -.013l.018 -.024l.033 -.038l.018 -.022l.009 -.008l.013 -.014l.04 -.036l.028 -.026l.008 -.006a1 1 0 0 1 .402 -.199l.011 -.001l.027 -.005l.074 -.013l.011 -.001l.041 -.002z" />
  </g>

  <!-- arm cuffs -->
  <rect x="322" y="725" width="66" height="34" fill="#f2d24b" stroke="#000000" stroke-width="18" />
  <rect x="636" y="725" width="66" height="34" fill="#f2d24b" stroke="#000000" stroke-width="18" />

  <!-- legs -->
  <rect x="418" y="725" width="80" height="150" fill="#a9cf68" stroke="#000000" stroke-width="18" />
  <rect x="526" y="725" width="80" height="150" fill="#a9cf68" stroke="#000000" stroke-width="18" />

  <!-- feet -->
  <rect x="388" y="857" width="110" height="40" fill="#00e6f4" stroke="#000000" stroke-width="18" />
  <rect x="526" y="857" width="110" height="40" fill="#00e6f4" stroke="#000000" stroke-width="18" />
</svg>